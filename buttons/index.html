<!DOCTYPE html>
<html lang="en">

    <head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Madison M. Buttons</title>

		<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic" rel="stylesheet" type="text/css">
		<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" type="text/css">
		<link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css">
       <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Quicksand:wght@300..700&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="https://kit.fontawesome.com/0ee016837e.js" crossorigin="anonymous"></script>

		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
        <link href="css/styles.css" rel="stylesheet">
	</head>

	<body>
		
		<main>

			<h1>Button Styling — Madison Morris</h1>
			
			<div class="button_container">
				<a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
			</div>

			<div class="button_container">
				<a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
			</div>

			<div class="button_container">
				<a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
			</div>

            <div class="button_container">
				<a href="http://www.instagram.com" target="_blank" id="btn_instagram"><span>Instagram</span></a>
			</div>
            
            <div class="button_container">
				<a href="http://www.oldnavy.gap.com" target="_blank" id="btn_oldnavy"><span>Old Navy</span></a>
			</div>

             <div class="button_container">
                <div class="tonightshow">
				<a href="https://www.nbc.com/the-tonight-show" target="_blank" id="btn_thetonightshow"><span><img src="https://upload.wikimedia.org/wikipedia/en/2/28/TSSJF_Logo.png" alt="The Tonight Show Logo" width="140" height="140"img></span></a>
                </div>
			</div>

             <div class="button_container">
				<a href="http://npr.org" target="_blank" id="btn_npr">
            <span class="block n">n</span>
            <span class="block p">p</span>
            <span class="block r">r</span> </a>
			</div>

            <div class="button_container">
				<a href="http://www.moo.com/us" target="_blank" id="btn_moo">  
                    <span class="droplet">
                        <img src="images/droplet-solid-full.svg" alt="droplet icon">
                    </span>
                    <span>MOO</span> </a>
			</div>
             <div class="button_container">
                <div class="btn liquid">
          
				<a href="http://www.coca-cola.com" target="_blank" id="btn_cocacola">
                 <span class="img-wrapper">  
                    <span>
                    <img src="images/coca-cola-red.png" alt="Coca Cola Logo Red" class="normal" width="200px">
                <img src="images/coca-cola-white.png" alt="Coca Cola Logo White" class="hover" width="200px"> 
                    </span></a>
                </span>
                </div>
			</div>

             <div class="button_container">
				<a href="http://www.thecolorurn.com" target="_blank" id="btn_thecolorrun"><span>THE COLOR RUN</span></a>
			</div>

             <div class="button_container">
                <div class="newyorker">
				<a href="https://www.newyorker.com" target="_blank" id="btn_thenewyorker"><span><img src="images/the-new-yorker.png" alt="The New Yorker Logo" width="200" height="auto"img></span></a>
                </div>
			</div>

            <div class="button_container">
				<a href="http://www.explodingkittens.com" target="_blank" id="btn_explodingkittens"><span>EXPLODING KITTENS</span></a>
			</div>
            
            <div class="button_container">
				<a href="http://www.missouribotanicalgarden.org" target="_blank" id="btn_botanicalgarden"><span>MISSOURI BOTANICAL GARDEN</span>
                    <span class="seedling">
                <i class="fa-solid fa-seedling fa-bounce" style="color: #234408;"></i>
                </span>
                </a>
			</div>

		</main>	

	
</body></html>
